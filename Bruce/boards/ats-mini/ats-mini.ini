; ATS Mini -- Si4732 receiver. ESP32-S3 N16R8 (16MB flash, 8MB OPI PSRAM),
; GC9307 170x320 panel on an 8-bit parallel bus, rotary encoder, battery
; voltage divider on GPIO4. No radio/RFID/I2C hardware is reachable from Bruce.

[env:ats-mini]
board = esp32s3
board_build.partitions = ats-mini.csv
; DIO: QIO hangs the ROM loader on this board. The framework only ships 80MHz
; bootloader images, so 80MHz it is (the stock firmware runs at 80MHz too).
board_build.flash_mode = dio

build_src_filter = ${env.build_src_filter} +<../boards/ats-mini>

build_flags =
	${env.build_flags}
	-Iboards/ats-mini

	; ==================== Framework Control Flags ====================
	-DBOARD_HAS_PSRAM=1
	-DCORE_DEBUG_LEVEL=1
	; precompiler_flags.h defines TOUCH_CS=-1, which TFT_eSPI rejects in
	; parallel mode; this silences that #error instead of patching upstream.
	-DDISABLE_ALL_LIBRARY_WARNINGS

	; ==================== Feature gates ====================
	-D HAS_ENCODER=1

	; ==================== Library Flags (display) ====================
	; GC9307 driven by TFT_eSPI's ST7789 driver, init sequence 3.
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED
	-DST7789_DRIVER=1
	-DINIT_SEQUENCE_3
	-DTFT_PARALLEL_8_BIT
	-DTFT_INVERSION_ON
	-DTFT_RGB_ORDER=TFT_RGB
	-DTFT_BACKLIGHT_ON=1
	-DSMOOTH_FONT=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_BL=38
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

	; ==================== Environment Flags ====================
	; Battery divider on GPIO4. The multiplier assumes a 1:2 divider; if the
	; readout comes out low/high on hardware, this is the number to change.
	-D ANALOG_BAT_PIN=4
	-D ANALOG_BAT_MULTIPLIER=2.0f
	-D ANALOG_BAT_MIN_MV=3300
	-D ANALOG_BAT_MAX_MV=4200

	-D DEVICE_NAME='"Bruce ATS Mini"'
	-DROTATION=3
	-DBTN_ALIAS='"Ok"'

	; No power switch: the encoder push button wakes the device from deep sleep.
	-DDEEPSLEEP_WAKEUP_PIN=21
	-DDEEPSLEEP_PIN_ACT=LOW

lib_deps =
	${env.lib_deps}
